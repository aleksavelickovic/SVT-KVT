<form (ngSubmit)="editUser()" [formGroup]='profileForm'>
  <mat-form-field>
    <mat-label>Email</mat-label>
    <input formControlName="email" matInput name="email" type="email"/>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Ime</mat-label>
    <input formControlName="name" matInput name="name" type="text"/>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Broj telefona</mat-label>
    <input formControlName="phone_number" matInput name="phone_number" type="text"/>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Grad</mat-label>
    <input formControlName="city" matInput name="birthday" type="text"/>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Adresa</mat-label>
    <input formControlName="address" matInput name="address" type="text"/>
  </mat-form-field>
  <div>
    <button color="primary" matButton="outlined" type="submit">Potvrdi</button>
  </div>
</form>
