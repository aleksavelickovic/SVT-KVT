<form (ngSubmit)="create()" [formGroup]='registerForm'>
  <mat-form-field>
    <mat-label>Email</mat-label>
    <input formControlName="email" matInput name="email" type="email"/>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Lozinka</mat-label>
    <input formControlName="password" matInput name="password" type="password"/>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Ime</mat-label>
    <input formControlName="name" matInput name="name" type="text"/>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Broj telefona</mat-label>
    <input formControlName="phone_number" matInput name="phone_number" type="text"/>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Datum rodjenja</mat-label>
    <input formControlName="birthday" matInput name="birthday" type="date"/>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Adresa</mat-label>
    <input formControlName="address" matInput name="address" type="text"/>
  </mat-form-field>
  <!--  <mat-form-field>-->
  <!--    <mat-label>Grad</mat-label>-->
  <!--    <input formControlName="city" matInput name="city" type="text"/>-->
  <!--  </mat-form-field>-->
  <div>
    <button color="primary" matButton="outlined" type="submit">Posaljite zahtev</button>
  </div>
  <!--  <div>-->
  <!--    <button color="primary" mat-raised-button [routerLink]="['register']">Neamte nalog? Posaljite zahtev za registraciju</button>-->
  <!--  </div>-->
</form>
