<h1>Dovrsite podesavanje svog naloga</h1>
<form (ngSubmit)="setupUser()" [formGroup]="setupForm">
  <mat-form-field>
    <mat-label>Grad</mat-label>
    <input formControlName="city" matInput name="city" type="text"/>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Ime</mat-label>
    <input formControlName="name" matInput name="name" type="text"/>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Broj telefona</mat-label>
    <input formControlName="phone_number" matInput name="phone_number" type="text"/>
  </mat-form-field>
  <input type="hidden" formControlName="email" value="{{localStorage.getItem('email')}}">
  <input type="hidden" formControlName="address" value="{{localStorage.getItem('address')}}">
  <input type="hidden" formControlName="imageFilename" value="{{localStorage.getItem('image')}}">
  <div>
    <button color="primary" matButton="outlined" type="submit">Posaljite zahtev</button>
  </div>
</form>
