@for (EventLocation of locations; track EventLocation.id) {
  <mat-card appearance="outlined" class="example-card">
    <mat-card-header>
      <!--      <div mat-card-avatar class="example-header-image"></div>-->
      <mat-card-title>{{ EventLocation.name }}</mat-card-title>
      <mat-card-subtitle>{{ EventLocation.address }}</mat-card-subtitle>
    </mat-card-header>
    <div>
      <img alt="Photo of a Shiba Inu"
           mat-card-image
           src="https://www.cvent.com/sites/default/files/styles/focus_scale_and_crop_800x450/public/image/2023-11/Business_Travel_Trends_Bleisure_Event-Cvent_CONNECT_2023.jpg.webp?itok=F_USbJO1"
           style="width: 100%; height: 500px">
    </div>
    <mat-card-content>
      <p>
        {{ EventLocation.description }}
        <br>
        Kreirano: {{ EventLocation.createdAt }}
        <br>
        {{ EventLocation.type }}

      </p>
    </mat-card-content>
    <mat-card-actions>
      <button matButton>LIKE</button>
      <button matButton>SHARE</button>
    </mat-card-actions>
  </mat-card>

}
