services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.24
    container_name: events-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - events-network

  minio:
    image: minio/minio:latest
    container_name: events-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - events-network

  mysql:
    image: mysql:8.0.39
    container_name: events-mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: events
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - events-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./Backend/events
      dockerfile: infrastructure/Dockerfile
    container_name: events-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/events?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Europe/Belgrade
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
      SPRING_SQL_INIT_MODE: never
      APP_ELASTICSEARCH_HOST: elasticsearch
      APP_ELASTICSEARCH_PORT: "9200"
      APP_ELASTICSEARCH_SCHEME: http
      APP_MINIO_URL: http://minio:9000
      APP_MINIO_ACCESS_KEY: minioadmin
      APP_MINIO_SECRET_KEY: minioadmin
      APP_MINIO_BUCKET_IMAGES: images
      APP_MINIO_BUCKET_DOCUMENTS: documents
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: "587"
      SPRING_MAIL_USERNAME: svtevents555@gmail.com
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: "true"
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - events-network

  frontend:
    build:
      context: ./Frontend/events-frontend
      dockerfile: Dockerfile
    container_name: events-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - events-network

volumes:
  es_data:
  minio_data:
  mysql_data:

networks:
  events-network:
    name: events-network
